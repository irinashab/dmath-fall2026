<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Irina Shablinsky">
  <meta name="description" content="Fall 2026 Discrete Math">
  <title>Discrete Math – Page Title</title>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header>
    <h1>Page Title</h1>
  </header>

  <div id="navigation-placeholder"></div>

  <main>
    <section class="lessons-notes">
   <ul>
   <li><a href="lessons/lesson0.html">Lesson 0 - Intro to the Course & Math Writing</a></li>
    <li><a href="lessons/lesson1.html">Lesson 1  - Propositional Logic</a></li>
     <li><a href="lessons/lesson2.html">Lesson 2  - Predicate Logic</a></li>
      <li><a href="lessons/lesson3.html">Lesson 3  - Proof Writing</a></li>
            <li><a href="lessons/lesson4.html">Lesson 4  - Sets and Proofs</a></li>
   </ul>
   </section>
  </main>

  <div id="footer-placeholder"></div>

  <script>
  const siteRoot = window.location.hostname.endsWith("github.io")
    ? `/${window.location.pathname.split("/").filter(Boolean)[0]}/`
    : "/";

  fetch(`${siteRoot}assets/includes/navigation.html`)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Navigation request failed: ${response.status}`);
      }
      return response.text();
    })
    .then(html => {
      const placeholder = document.getElementById("navigation-placeholder");
      placeholder.innerHTML = html;

      placeholder.querySelectorAll("a[data-path]").forEach(link => {
        link.href = `${siteRoot}${link.dataset.path}`;
      });
    })
    .catch(error => console.error("Navigation load failed:", error));

  fetch(`${siteRoot}assets/includes/footer.html`)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Footer request failed: ${response.status}`);
      }
      return response.text();
    })
    .then(html => {
      document.getElementById("footer-placeholder").innerHTML = html;
    })
    .catch(error => console.error("Footer load failed:", error));
</script>

</body>
</html>
